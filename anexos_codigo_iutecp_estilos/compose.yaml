services:
  kroki:
    image: yuzutech/kroki:latest
    restart: unless-stopped
    depends_on:
      - mermaid
    environment:
      KROKI_LISTEN: 0.0.0.0:8000
      KROKI_SAFE_MODE: SECURE
      KROKI_MERMAID_HOST: mermaid
      KROKI_MERMAID_PORT: "8002"
      KROKI_DELEGATE_TIMEOUT_MS: "60000"
      KROKI_CONVERT_TIMEOUT: 60s
    ports:
      - "127.0.0.1:8000:8000"
    tmpfs:
      - /tmp:exec
    networks:
      - kroki_net

  mermaid:
    image: yuzutech/kroki-mermaid:latest
    restart: unless-stopped
    expose:
      - "8002"
    networks:
      - kroki_net

networks:
  kroki_net:
    name: iutecp-kroki
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.240.0/24
